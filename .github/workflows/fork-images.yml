# This fork's backend and frontend images. Fork-only.
#
#   ghcr.io/lovingcivilian/agenticos-backend    the API, the background worker, the migrations
#   ghcr.io/lovingcivilian/agenticos-frontend   the console
#
# Upstream's `images.yml` publishes upstream's code under `ghcr.io/vstorm-co`
# and is disabled here. A fork release tag, `fork/1.6.1-2`, publishes `1.6.1-2`,
# `sha-<short>` and moves `latest`; a run by hand publishes `sha-<short>` of the
# ref it ran on. The server pins the version with `AGENTICOS_VERSION` in
# `backend/.env`, and `docker-compose-prod.fork.yml` names these images.
#
# Built for `linux/amd64` only, from the same Dockerfiles and contexts as
# upstream's `images.yml`. Without the browser image, which no prod compose
# file runs.

name: Fork images

on:
  push:
    tags: ["fork/*"]
  workflow_dispatch:

permissions:
  contents: read

# One run per ref, never cancelled: a cancelled release run is a tag with no
# images.
concurrency:
  group: fork-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push the images to ghcr.io/lovingcivilian
    strategy:
      fail-fast: false
      matrix:
        include:
          # The backend's context is the repository root, for `emails/compiled/`.
          - image: backend
            context: .
            file: backend/Dockerfile
          - image: frontend
            context: ./frontend
            file: frontend/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read the tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/lovingcivilian/agenticos-${{ matrix.image }}
          tags: |
            type=match,pattern=fork/(.*),group=1
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/fork/') }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=fork-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=fork-${{ matrix.image }}
